version: 2

sources:
  - name: ml
    description: Results written to PostgreSQL by CyberSentinel Python ML pipelines.
    schema: ml

    tables:
      - name: authentication_anomaly_scores
        description: >-
          Latest authentication anomaly and security-risk score for every
          hourly machine-user behaviour window.

        columns:
          - name: authentication_window_id
            tests:
              - unique
              - not_null

          - name: machine_id
            tests:
              - not_null

          - name: username
            tests:
              - not_null

          - name: is_anomaly
            tests:
              - not_null
              - accepted_values:
                  values: [0, 1]
                  quote: false

          - name: detection_status
            tests:
              - not_null
              - accepted_values:
                  values: ['Normal', 'Anomaly']

          - name: risk_level
            tests:
              - not_null
              - accepted_values:
                  values: ['Low', 'Medium', 'High', 'Critical']

          - name: model_version
            tests:
              - not_null

          - name: scored_at
            tests:
              - not_null
