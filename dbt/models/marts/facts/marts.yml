version: 2

models:
  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: dim_time
    columns:
      - name: time_key
        tests:
          - unique
          - not_null

  - name: dim_machine
    columns:
      - name: machine_key
        tests:
          - unique
          - not_null

      - name: machine_id
        tests:
          - unique
          - not_null

  - name: dim_collection
    columns:
      - name: collection_key
        tests:
          - unique
          - not_null

  - name: dim_user
    columns:
      - name: user_key
        tests:
          - unique
          - not_null

  - name: dim_ip
    columns:
      - name: ip_key
        tests:
          - unique
          - not_null

  - name: dim_provider
    columns:
      - name: provider_key
        tests:
          - unique
          - not_null

  - name: dim_event_type
    columns:
      - name: event_type_key
        tests:
          - unique
          - not_null

  - name: dim_severity
    columns:
      - name: severity_key
        tests:
          - unique
          - not_null

  - name: fact_security_event
    columns:
      - name: event_key
        tests:
          - unique
          - not_null

      - name: event_uid
        tests:
          - unique
          - not_null

      - name: machine_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_machine')
              field: machine_key

      - name: date_key
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_key

      - name: time_key
        tests:
          - relationships:
              to: ref('dim_time')
              field: time_key

  - name: fact_authentication_event
    columns:
      - name: event_key
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('fact_security_event')
              field: event_key

  - name: fact_firewall_event
    columns:
      - name: event_key
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('fact_security_event')
              field: event_key

  - name: fact_defender_event
    columns:
      - name: event_key
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('fact_security_event')
              field: event_key

  - name: fact_usb_event
    columns:
      - name: event_key
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('fact_security_event')
              field: event_key