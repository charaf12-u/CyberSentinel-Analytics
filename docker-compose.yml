services:
  postgres:
    image: postgres:16
    container_name: cybersentinel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cyber_network


  airflow-postgres:
    image: postgres:16
    container_name: cybersentinel-airflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - cyber_network


  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: cybersentinel-airflow-init

    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB_NAME}

      PYTHONPATH: /opt/airflow/project
      DBT_PROFILES_DIR: /opt/airflow/project/dbt

    volumes: &airflow_volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins:ro

      - ./ingestion:/opt/airflow/project/ingestion:ro
      - ./scripts:/opt/airflow/project/scripts:ro
      - ./sql:/opt/airflow/project/sql:ro
      - ./dbt:/opt/airflow/project/dbt

      - ./cybersentinel_auth_ml:/opt/airflow/project/cybersentinel_auth_ml:ro

      - ./data/raw:/opt/airflow/project/data/raw:ro
      - ./data/quarantine:/opt/airflow/project/data/quarantine
      - ./data/reports:/opt/airflow/project/data/reports

      - ./.env:/opt/airflow/project/.env:ro

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "CyberSentinel" \
          --lastname "Admin" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true

    networks:
      - cyber_network


  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: cybersentinel-airflow-webserver
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env

    environment: *airflow_environment

    ports:
      - "8080:8080"

    volumes: *airflow_volumes

    command: airflow webserver

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail http://localhost:8080/health || exit 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - cyber_network


  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile

    container_name: cybersentinel-airflow-scheduler
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment: *airflow_environment

    volumes: *airflow_volumes

    command: airflow scheduler

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - cyber_network


volumes:
  postgres_data:
  airflow_postgres_data:


networks:
  cyber_network:
    driver: bridge